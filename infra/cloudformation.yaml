AWSTemplateFormatVersion: "2010-09-09"
Description: >
  LUADtx backend + Postgres on a single EC2 instance. Creates: S3 bucket
  (backups), Secrets Manager secret (DB password, auto-generated), IAM
  role/instance profile (scoped to just this bucket + this secret + SSM +
  CloudWatch Logs), a security group (API port only -- no SSH port, access
  is via SSM Session Manager instead), a CloudWatch log group, and the EC2
  instance itself with a UserData bootstrap script.

Parameters:
  InstanceType:
    Type: String
    Default: t3.medium
    Description: >
      Sized from a real measured mhcflurry-predict peak (~1GB RSS) plus
      Postgres + Docker + OS overhead -- 4GB gives real headroom.

  GitHubRepoUrl:
    Type: String
    Default: https://github.com/yujuan-zhang/luadtx.git

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Resolved to the current Amazon Linux 2023 AMI at deploy time -- never a hardcoded, staleable AMI ID.

Resources:

  # ── S3: backup destination (Postgres dumps / analysis result exports) ──
  BackupBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "luadtx-backups-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ── Secrets Manager: Postgres password, generated by AWS, never typed by us ──
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: luadtx/postgres-password
      GenerateSecretString:
        PasswordLength: 24
        ExcludePunctuation: true  # keep it shell/connection-string safe

  # ── CloudWatch: where container stdout/stderr goes ──
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /luadtx/backend
      RetentionInDays: 14

  # ── IAM: least-privilege role for the EC2 instance itself ──
  # Scoped to exactly three things: this bucket, this secret, this log
  # group -- plus the two AWS-managed policies for SSM access (replaces
  # SSH) and nothing else. No ECR permission (this deploy builds the image
  # on-instance instead of pulling from a registry -- see conversation for
  # why ECR was cut for a single-instance setup).
  Ec2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: luadtx-scoped-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt BackupBucket.Arn
                  - !Sub "${BackupBucket.Arn}/*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DbSecret
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !GetAtt BackendLogGroup.Arn

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref Ec2Role

  # ── Security group: API port only. No port 22 -- shell access is via
  # SSM Session Manager (covered by the IAM role above), so there is no
  # SSH key to manage and no inbound SSH surface at all. ──
  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: LUADtx backend + frontend ports only, no SSH
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          CidrIp: 0.0.0.0/0

  # ── The instance itself ──
  BackendInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref Ec2InstanceProfile
      SecurityGroupIds:
        - !Ref BackendSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20  # default 8GB isn't enough -- the tensorflow-based
                             # backend image alone is 4.5GB; hit "disk full"
                             # risk on the first real deploy.
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: luadtx-backend
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          # Docker + compose plugin + git (Amazon Linux 2023: dnf, docker in extras)
          dnf install -y docker git
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          # buildx is a separate plugin ("compose build" needs it) --
          # buildx's release filenames embed the version number (unlike
          # compose's), so there's no version-agnostic "latest" URL; resolve
          # the current release via the API instead of hardcoding a version
          # that will eventually go stale.
          BUILDX_URL=$(curl -s https://api.github.com/repos/docker/buildx/releases/latest \
            | grep browser_download_url | grep 'linux-amd64"' \
            | grep -v -E 'sbom|provenance|sigstore' | cut -d '"' -f4)
          curl -SL "$BUILDX_URL" -o /usr/local/lib/docker/cli-plugins/docker-buildx
          chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx

          git clone ${GitHubRepoUrl} /opt/luadtx
          cd /opt/luadtx

          # Pull the DB password out of Secrets Manager -- never hardcoded,
          # never in git. aws cli is preinstalled on AL2023.
          DB_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id ${DbSecret} \
            --query SecretString --output text \
            --region ${AWS::Region})
          echo "POSTGRES_PASSWORD=${!DB_PASSWORD}" > .env

          # Environment-specific overlay (AWS log driver) -- not committed
          # to git, generated here because it only makes sense on AWS.
          cat > docker-compose.override.yml <<EOF
          services:
            postgres:
              logging:
                driver: awslogs
                options:
                  awslogs-group: ${BackendLogGroup}
                  awslogs-region: ${AWS::Region}
                  awslogs-stream: postgres
            backend:
              logging:
                driver: awslogs
                options:
                  awslogs-group: ${BackendLogGroup}
                  awslogs-region: ${AWS::Region}
                  awslogs-stream: backend
          EOF

          docker compose up -d --build

Outputs:
  InstancePublicIp:
    Description: Public IP -- API reachable at http://<this>:8000
    Value: !GetAtt BackendInstance.PublicIp
  BackupBucketName:
    Value: !Ref BackupBucket
  DbSecretArn:
    Value: !Ref DbSecret
  LogGroupName:
    Value: !Ref BackendLogGroup
  SsmConnectCommand:
    Description: How to get a shell on the instance (no SSH key needed)
    Value: !Sub "aws ssm start-session --target ${BackendInstance} --region ${AWS::Region}"
